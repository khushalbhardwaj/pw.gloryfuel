<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GloryFuel Player</title>
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.min.js"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box }
body {
  background:#000; color:#fff; font-family:'Outfit',sans-serif;
  display:flex; flex-direction:column; height:100vh; overflow:hidden;
}
#header {
  display:flex; align-items:center; gap:12px; padding:12px 20px;
  background:#0a0a0a; border-bottom:1px solid rgba(255,255,255,0.06);
  flex-shrink:0; z-index:10;
}
#back-btn {
  background:none; border:none; color:rgba(255,255,255,0.4);
  font-size:14px; font-weight:600; cursor:pointer;
  font-family:'Outfit',sans-serif; padding:4px 10px 4px 6px;
  border-radius:6px; transition:all .2s;
}
#back-btn:hover { color:#a78bfa; background:rgba(167,139,250,0.1) }
#dl-btn {
  margin-left:auto; background:rgba(167,139,250,0.12); border:none;
  color:#a78bfa; font-size:16px; cursor:pointer; padding:6px 14px;
  border-radius:8px; text-decoration:none; transition:all .2s;
  font-family:'Outfit',sans-serif; font-weight:600; display:flex;
  align-items:center; gap:6px;
}
#dl-btn:hover { background:rgba(167,139,250,0.25); color:#c4b5fd }
#dl-btn::after { content:"Download"; font-size:13px }
@media (max-width:640px) {
  #dl-btn { padding:6px 10px }
  #dl-btn::after { content:"" }
}
#title {
  font-size:14px; font-weight:500; color:rgba(255,255,255,0.7);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
#main-wrap {
  flex:1; display:flex; min-height:0;
}
#player-wrap {
  flex:1; display:flex; align-items:center; justify-content:center;
  background:#000; position:relative; min-height:0;
}
#player-wrap .plyr { height:100%; width:100%; max-height:100vh }
#player-wrap .plyr__video-wrapper { height:100% }
#player-wrap video { width:100%; height:100%; outline:none }
#sidebar {
  width:320px; flex-shrink:0; background:#0d0d14;
  border-left:1px solid rgba(255,255,255,0.06);
  display:flex; flex-direction:column; overflow:hidden;
}
#sidebar-tabs {
  display:flex; border-bottom:1px solid rgba(255,255,255,0.06); flex-shrink:0;
}
#sidebar-tabs button {
  flex:1; padding:12px; background:none; border:none;
  color:rgba(255,255,255,0.4); font-family:'Outfit',sans-serif;
  font-size:13px; font-weight:600; cursor:pointer; transition:all .2s;
}
#sidebar-tabs button.active { color:#a78bfa; border-bottom:2px solid #a78bfa }
#sidebar-list { flex:1; overflow-y:auto; padding:8px }
.sidebar-item {
  display:flex; gap:10px; padding:10px 12px; border-radius:10px;
  cursor:pointer; transition:background .15s; align-items:flex-start;
}
.sidebar-item:hover { background:rgba(167,139,250,0.08) }
.sidebar-item.active { background:rgba(167,139,250,0.12) }
.sidebar-item .thumb {
  width:80px; height:45px; border-radius:6px; background:#1a1a24;
  flex-shrink:0; overflow:hidden; display:flex; align-items:center; justify-content:center;
  font-size:20px;
}
.sidebar-item .thumb img { width:100%; height:100%; object-fit:cover }
.sidebar-item .info { flex:1; min-width:0 }
.sidebar-item .info .name { font-size:13px; font-weight:500; color:rgba(255,255,255,0.8); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
.sidebar-item .info .meta { font-size:11px; color:rgba(255,255,255,0.3); margin-top:3px }
#sidebar-loading { padding:20px; text-align:center; color:rgba(255,255,255,0.3); font-size:13px }

@media (max-width:1024px) {
  body { overflow-y:auto }
  #main-wrap { flex-direction:column; min-height:auto }
  #player-wrap { flex:none; max-height:45vh; aspect-ratio:16/9 }
  #sidebar { width:100%; max-height:none; border-left:none; flex:none; overflow:visible }
  #sidebar-list { overflow:visible; max-height:none }
}
@media (max-width:1024px) and (orientation:landscape) {
  #player-wrap { max-height:80vh; aspect-ratio:auto }
}
@media (max-width:640px) {
  #header { padding:10px 14px; gap:8px }
  #back-btn { font-size:13px; padding:3px 8px 3px 4px }
  #title { font-size:13px }
  #player-wrap { max-height:40vh }
  .sidebar-item { padding:8px 10px; gap:8px }
  .sidebar-item .thumb { width:56px; height:32px; font-size:14px }
  .sidebar-item .info .name { font-size:12px }
  #sidebar-tabs button { padding:10px; font-size:12px }
}
#overlay {
  position:absolute; inset:0; display:flex;
  align-items:center; justify-content:center; flex-direction:column; gap:14px;
  background:rgba(0,0,0,0.85); z-index:5;
  transition:opacity .4s;
}
#overlay.hidden { opacity:0; pointer-events:none }
#overlay .spinner {
  width:36px; height:36px; border:3px solid rgba(255,255,255,0.1);
  border-top-color:#a78bfa; border-radius:50%; animation:spin .7s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg) } }
#overlay .msg { font-size:14px; color:rgba(255,255,255,0.5) }
#overlay .sub { font-size:12px; color:rgba(255,255,255,0.25); max-width:420px; text-align:center; line-height:1.5 }
#error-box {
  display:none; align-items:center; justify-content:center; gap:10px;
  padding:10px 18px; background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.25);
  border-radius:8px; font-size:13px; color:#f87171; margin-top:4px;
}
#error-box.show { display:flex }
/* Plyr custom theme — purple accent */
.plyr { --plyr-color-main: #a78bfa; --plyr-video-control-color: #fff; --plyr-video-control-background-hover: #a78bfa; --plyr-range-thumb-background: #fff; --plyr-range-fill-background: #a78bfa; --plyr-menu-background: rgba(20,20,30,0.95); --plyr-menu-color: #ddd; --plyr-menu-arrow-color: #a78bfa; --plyr-tooltip-background: rgba(20,20,30,0.95); --plyr-tooltip-color: #ddd; --plyr-control-toggle-checked-background: #a78bfa; --plyr-badge-background: #a78bfa; --plyr-font-family: 'Outfit',sans-serif }
.plyr__control--overlaid { background:#a78bfa; opacity:.92 }
.plyr--video .plyr__controls { background:linear-gradient(transparent,rgba(0,0,0,0.75)) }
.plyr__menu__container { backdrop-filter:blur(12px) }
</style>
</head>
<body>
<div id="header">
  <button id="back-btn">← Back</button>
  <div id="title">Loading...</div>
  <a id="dl-btn" href="#" download onclick="event.stopPropagation()" title="Download video">⬇</a>
</div>
<div id="main-wrap">
<div id="player-wrap">
  <video id="video" playsinline></video>
  <div id="overlay">
    <div class="spinner"></div>
    <div class="msg" id="status-msg">Initialising player...</div>
    <div class="sub" id="status-sub"></div>
    <div id="error-box"><span>⚠️</span><span id="error-text"></span></div>
  </div>
</div>
<div id="sidebar" style="display:none">
  <div id="sidebar-tabs">
    <button class="active" data-tab="videos" onclick="switchSidebarTab('videos')">📹 Videos</button>
    <button data-tab="notes" onclick="switchSidebarTab('notes')">📄 Notes</button>
  </div>
  <div id="sidebar-list"><div id="sidebar-loading">Loading related content...</div></div>
</div>
</div>

<script src="config.js"></script>
<script>
const API = API_BASE;
async function apiFetch(url, opts = {}) {
  opts.headers = { ...opts.headers, 'x-api-key': API_KEY };
  return fetch(url, opts);
}

let currentBatchId, currentChildId, currentSubjectId, currentSubjectSlug, currentTopicSlug;
let sidebarVideos = [], sidebarNotes = [], sidebarActiveTab = 'videos';

function switchSidebarTab(tab) {
  sidebarActiveTab = tab;
  document.querySelectorAll('#sidebar-tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  renderSidebar();
}

function playVideo(i) {
  const item = sidebarVideos[i];
  const childId = item.videoDetails?.findKey || item._id;
  const title = item.topic || 'Untitled';
  history.pushState(null, '', `?batchId=${encodeURIComponent(currentBatchId)}&childId=${encodeURIComponent(childId)}&subjectId=${encodeURIComponent(currentSubjectId)}&subjectSlug=${encodeURIComponent(currentSubjectSlug)}&topicSlug=${encodeURIComponent(currentTopicSlug)}&title=${encodeURIComponent(title)}`);
  location.reload();
}

function openNote(i) {
  const item = sidebarNotes[i];
  const homeworkIds = item.homeworkIds || [];
  if (!homeworkIds.length) return;
  const att = homeworkIds[0]?.attachmentIds?.[0] || homeworkIds[0]?.attachments?.[0] || null;
  const directUrl = att?.url || att?.fileUrl || att?.fileUrlHD || att?.path || null;
  if (directUrl) {
    window.open(directUrl, '_blank');
    return;
  }
  apiFetch(`${API}/study/attachments?BatchId=${encodeURIComponent(currentBatchId)}&SubjectId=${encodeURIComponent(currentSubjectId)}&ContentId=${encodeURIComponent(item._id)}`)
    .then(r => r.json().catch(() => null))
    .then(data => {
      const items = Array.isArray(data) ? data : data?.data || [];
      const a = items[0];
      const u = a?.url || a?.fileUrl || (typeof a === 'string' ? a : null);
      if (u) window.open(u, '_blank');
    }).catch(() => {});
}

function renderSidebar() {
  const list = document.getElementById('sidebar-list');
  const items = sidebarActiveTab === 'videos' ? sidebarVideos : sidebarNotes;
  if (!items.length) { list.innerHTML = '<div id="sidebar-loading">No ' + sidebarActiveTab + ' found</div>'; return; }
  list.innerHTML = items.map((item, i) => {
    if (sidebarActiveTab === 'videos') {
      const isActive = item._id === currentChildId || item.videoDetails?.findKey === currentChildId;
      const thumb = item.videoDetails?.image || item.image || '';
      const dur = item.videoDetails?.duration || item.duration || '';
      return `<div class="sidebar-item${isActive?' active':''}" onclick="${isActive?'':'playVideo('+i+')'}">
        <div class="thumb">${thumb ? `<img src="${thumb}" alt="">` : '📹'}</div>
        <div class="info"><div class="name">${item.topic || 'Untitled'}</div><div class="meta">${dur ? '⏱ '+dur : ''}</div></div>
      </div>`;
    } else {
      const rawAtt = (item.homeworkIds || [])[0]?.attachmentIds?.[0] || (item.homeworkIds || [])[0]?.attachments?.[0] || (item.homeworkIds || [])[0]?.files?.[0] || null;
      const attTitle = rawAtt?.topic || rawAtt?.title || rawAtt?.name || rawAtt?.fileName || '';
      const tit = item.topic || item.title || item.name || item.heading || item.lectureName || item.description || item.fileName || attTitle || 'Untitled';
      return `<div class="sidebar-item" onclick="openNote(${i})">
        <div class="thumb">📄</div>
        <div class="info"><div class="name">${tit}</div></div>
      </div>`;
    }
  }).join('');
}

async function loadSidebar() {
  try {
    const topResp = await apiFetch(`${API}/study/datacontent?batchId=${encodeURIComponent(currentBatchId)}&subjectSlug=${encodeURIComponent(currentSubjectSlug)}&topicSlug=${encodeURIComponent(currentTopicSlug)}&contentType=videos`);
    const topData = await topResp.json();
    if (topData.success && Array.isArray(topData.data)) sidebarVideos = topData.data;
  } catch {}
  try {
    const noteResp = await apiFetch(`${API}/study/datacontent?batchId=${encodeURIComponent(currentBatchId)}&subjectSlug=${encodeURIComponent(currentSubjectSlug)}&topicSlug=${encodeURIComponent(currentTopicSlug)}&contentType=notes`);
    const noteData = await noteResp.json();
    if (noteData.success && Array.isArray(noteData.data)) sidebarNotes = noteData.data;
  } catch {}
  document.getElementById('sidebar').style.display = 'flex';
  renderSidebar();
}

async function init() {
  const params = new URLSearchParams(location.search);
  currentBatchId = params.get('batchId');
  currentChildId = params.get('childId');
  currentSubjectId = params.get('subjectId');
  currentSubjectSlug = params.get('subjectSlug') || '';
  currentTopicSlug = params.get('topicSlug') || '';
  const title = params.get('title') || 'Video';
  document.getElementById('title').textContent = title;
  document.getElementById('back-btn').onclick = () => window.history.back();
  document.getElementById('dl-btn').href = `${API}/study/download?batchId=${encodeURIComponent(currentBatchId)}&childId=${encodeURIComponent(currentChildId)}&subjectId=${encodeURIComponent(currentSubjectId)}&subjectSlug=${encodeURIComponent(currentSubjectSlug)}&title=${encodeURIComponent(title)}`;

  const $ = id => document.getElementById(id);
  const status = (msg, sub) => { $('status-msg').textContent = msg; $('status-sub').textContent = sub || '' };
  const showError = msg => {
    $('error-text').textContent = msg;
    $('error-box').classList.add('show');
    $('overlay').classList.remove('hidden');
  };

  // Load sidebar content in background
  if (currentTopicSlug) loadSidebar();

  try {
    status('Fetching video URL...');
    const urlResp = await apiFetch(`${API}/study/video-url?batchId=${encodeURIComponent(currentBatchId)}&childId=${encodeURIComponent(currentChildId)}&subjectId=${encodeURIComponent(currentSubjectId)}&subjectSlug=${encodeURIComponent(currentSubjectSlug)}`);
    const urlData = await urlResp.json();
    if (!urlData.success || !urlData.data?.[0]?.url) {
      showError(urlData.error || 'Video not available for this content');
      return;
    }
    const mpdUrl = urlData.data[0].url;
    const streamType = urlData.data[0].type || 'mpd';

    if (streamType === 'youtube') {
      $('video').style.display = 'none';
      $('overlay').classList.add('hidden');
      const iframe = document.createElement('iframe');
      iframe.src = `https://www.youtube.com/embed/${mpdUrl}?autoplay=1&rel=0`;
      iframe.allow = 'autoplay; encrypted-media';
      iframe.allowFullscreen = true;
      iframe.style.cssText = 'width:100%;height:100%;border:0';
      document.getElementById('player-wrap').prepend(iframe);
      status('');
      document.title = title;
      return;
    }

    status('Fetching decryption key...');
    const kidResp = await apiFetch(`${API}/study/kid?mpdUrl=${encodeURIComponent(mpdUrl)}`);
    const kidData = await kidResp.json();
    if (!kidData.success) { showError('Failed to get decryption key'); return; }
    const otpResp = await apiFetch(`${API}/study/otp?kid=${kidData.kid}`);
    const otpData = await otpResp.json();
    if (!otpData.success) { showError('Failed to get decryption key'); return; }

    const kid = kidData.kid;
    const key = otpData.key;

    const manifestUrl = `${API}/study/mpd?url=${encodeURIComponent(mpdUrl)}`;

    status('Starting player...');
    shaka.polyfill.installAll();
    if (!shaka.Player.isBrowserSupported()) {
      showError('Browser does not support video playback');
      return;
    }

    const video = $('video');
    const shakaPlayer = new shaka.Player(video);

    const proxyUrl = `${API}/study/proxy`;
    shakaPlayer.getNetworkingEngine().registerRequestFilter((type, request) => {
      let u = request.uris[0];
      if (u.startsWith('https://sec-prod-mediacdn.pw.live')) {
        request.uris = [proxyUrl + '?url=' + encodeURIComponent(u)];
      }
    });

    shakaPlayer.configure({
      drm: { clearKeys: { [kid]: key } },
      streaming: { rebufferingGoal: 15 }
    });

    shakaPlayer.addEventListener('error', event => {
      showError(shaka.util.ErrorUtils.stringify(event.detail));
    });

    // Initialise Plyr on the same video element
    const plyr = new Plyr(video, {
      controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'settings', 'fullscreen'],
      settings: ['speed'],
      speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2] },
      keyboard: { focused: true, global: true },
      tooltips: { controls: true, seek: true },
      seekTime: 10,
      clickToPlay: true,
      hideControls: true,
      resetOnEnd: true,
    });

    // Shaka load -> Plyr auto-detects playback
    await shakaPlayer.load(manifestUrl);

    // Build quality selector from shaka tracks
    const qualityTracks = shakaPlayer.getVariantTracks().filter(t => t.mimeType && t.mimeType.startsWith('video/'));
    if (qualityTracks.length > 1) {
      const heights = [...new Set(qualityTracks.map(t => parseInt(t.height) || 0))].filter(h => h > 0).sort((a, b) => b - a);
      const sel = document.createElement('select');
      sel.id = 'quality-select';
      sel.style.cssText = 'background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.12);border-radius:6px;padding:4px 8px;font-size:12px;font-family:Outfit,sans-serif;cursor:pointer;outline:none;margin-left:auto';
      heights.forEach(h => {
        const o = document.createElement('option');
        o.value = h; o.textContent = h + 'p';
        sel.appendChild(o);
      });
      const trackByH = {}; qualityTracks.forEach(t => { trackByH[t.height] = t; });
      sel.addEventListener('change', () => {
        const t = trackByH[parseInt(sel.value)];
        if (t) shakaPlayer.selectVariantTrack(t, true);
      });
      shakaPlayer.addEventListener('trackchanged', () => {
        const a = qualityTracks.find(t => t.active);
        if (a && a.height) sel.value = a.height;
      });
      document.getElementById('header').insertBefore(sel, document.getElementById('dl-btn'));
    }

    $('overlay').classList.add('hidden');
    document.title = title;
  } catch (e) {
    showError(e.message || 'Unknown error');
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
