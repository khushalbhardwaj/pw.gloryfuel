<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GloryFuel Player</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px}
.spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,0.1);border-top-color:#a78bfa;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{font-size:15px;color:rgba(255,255,255,0.5)}
a{color:#a78bfa;text-decoration:underline}
</style>
</head>
<body>
<div class="spinner"></div>
<div class="msg">Redirecting to player...</div>
<script>(function(){var p=new URLSearchParams(location.search);if(p.has('batchId')&&p.has('childId')){location.href='https://pwthor.live/watch?'+p.toString()}else{document.body.innerHTML='<div class="msg">Missing video parameters. <a href="https://pwthor.live/study">Go to study page</a></div>'}})()</script>
</body>
</html>
