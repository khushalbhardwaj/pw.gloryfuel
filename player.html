<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GloryFuel Player</title>
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4/dist/shaka-player.compiled.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--accent:#a78bfa;--bg:#0a0b12}
body{background:var(--bg);color:#eef0ff;font-family:system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#player-wrap{position:relative;width:100%;flex:1;background:#000;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:contain}
#loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;background:rgba(0,0,0,.6)}
#loader .sp{width:36px;height:36px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
#loader .lt{font-size:14px;color:rgba(255,255,255,.5);margin-top:10px}
@keyframes spin{to{transform:rotate(360deg)}}
#error{position:absolute;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.75);flex-direction:column;gap:12px;display:none}
#error .icon{font-size:40px;opacity:.6}
#error .msg{font-size:15px;color:rgba(255,255,255,.5);max-width:300px;text-align:center}
#error button{background:var(--accent);color:#fff;border:none;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:14px}
#title-bar{position:absolute;top:0;left:0;right:0;padding:40px 16px 20px;background:linear-gradient(rgba(0,0,0,.7),transparent);z-index:5}
#title-bar h2{font-size:15px;font-weight:600;line-height:1.3}
#controls{padding:8px 12px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.03)}
#controls button{background:rgba(255,255,255,.08);border:none;color:rgba(255,255,255,.85);cursor:pointer;padding:6px 12px;border-radius:6px;font-size:13px}
#controls button:hover{background:rgba(255,255,255,.15)}
#status{font-size:12px;color:rgba(255,255,255,.4)}
</style>
</head>
<body>
<div id="player-wrap">
  <video id="video" playsinline autoplay controls></video>
  <div id="title-bar"><h2 id="videoTitle">Loading...</h2></div>
  <div id="loader"><div style="text-align:center"><div class="sp"></div><div class="lt" id="loadText">Loading video...</div></div></div>
  <div id="error"><div class="icon">&#9888;</div><div class="msg" id="errMsg">Video not available</div><button onclick="location.reload()">Retry</button></div>
</div>
<div id="controls">
  <button onclick="window.history.back()">&#8592; Back</button>
  <span id="status"></span>
</div>
<script>
shaka.polyfill.installAll();

const params = new URLSearchParams(location.search);
const batchId = params.get('batchId');
const childId = params.get('childId');
const subjectSlug = params.get('subjectSlug') || params.get('subjectId') || '';
const title = params.get('title') || 'Lecture';
const video = document.getElementById('video');
const loader = document.getElementById('loader');
const errorEl = document.getElementById('error');
const loadText = document.getElementById('loadText');
const statusEl = document.getElementById('status');
document.getElementById('videoTitle').textContent = title;
document.title = title;

function showError(msg) {
  loader.style.display = 'none';
  document.getElementById('errMsg').textContent = msg || 'Video not available';
  errorEl.style.display = 'flex';
}

function setStatus(s) { statusEl.textContent = s; }

async function playVideo() {
  if (!batchId || !childId) {
    showError('Missing video parameters');
    return;
  }
  try {
    // Step 1: Get signed video URL
    loadText.textContent = 'Getting video URL...';
    let url = `/api/study/video-url?batchId=${encodeURIComponent(batchId)}&childId=${encodeURIComponent(childId)}`;
    if (subjectSlug) url += `&subjectSlug=${encodeURIComponent(subjectSlug)}`;
    const urlResp = await fetch(url);
    const urlData = await urlResp.json();
    if (!urlData.success || !urlData.data || !urlData.data.length) {
      showError('Video URL not available');
      return;
    }
    const signedUrl = urlData.data[0].url;
    if (!signedUrl) { showError('No signed URL returned'); return; }
    setStatus('Got signed URL');

    // Step 2: Get MPD and extract KID
    loadText.textContent = 'Getting decryption key...';
    const kidResp = await fetch(`/api/study/kid?mpdUrl=${encodeURIComponent(signedUrl)}`);
    const kidData = await kidResp.json();
    if (!kidData.success || !kidData.kid) {
      showError('Failed to get KID');
      return;
    }
    const kid = kidData.kid;
    setStatus('KID: ' + kid.substring(0, 8) + '...');

    // Step 3: Get decryption key via OTP
    const otpResp = await fetch(`/api/study/otp?kid=${encodeURIComponent(kid)}`);
    const otpData = await otpResp.json();
    if (!otpData.success || !otpData.key) {
      showError('Failed to get decryption key');
      return;
    }
    const decKey = otpData.key;
    setStatus('Got decryption key');

    // Step 4: Configure Shaka with clear key
    loadText.textContent = 'Starting playback...';
    if (!shaka.Player.isBrowserSupported()) {
      showError('DASH not supported in this browser');
      return;
    }

    const player = new shaka.Player(video);
    player.configure({
      drm: {
        clearKeys: { [kid]: decKey }
      }
    });

    // Step 5: Load via MPD proxy
    const mpdUrl = `/api/study/mpd?url=${encodeURIComponent(signedUrl)}`;
    await player.load(mpdUrl);
    loader.style.display = 'none';
    video.play().catch(() => {});
    setStatus('Playing');
  } catch (e) {
    showError('Playback failed: ' + e.message);
  }
}

playVideo();
</script>
</body>
</html>
