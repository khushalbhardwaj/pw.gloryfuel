<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gloryfuel -PW</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <button id="nav-back-btn" class="nav-back-btn" style="display:none">←</button>
        <div class="brand">gloryfuel</div>
        <div class="header-right">
          <button id="about-btn" onclick="location.href='about.html'">About</button>
          <div class="batch-count">0 batches</div>
          <button id="fav-nav-btn" onclick="showFavourites()" title="Favourites">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            <span id="fav-count">0</span>
          </button>
        </div>
    </header>
    <div class="page-title">choose your
        <span>batch</span>
    </div>
    <div id="cat-filter" style="display:none;padding:0 28px 10px">
      <select id="cat-select">
        <option value="All">All Categories</option>
      </select>
      <input type="text" id="search-input" placeholder="Search batches..." autocomplete="off">
    </div>
    <div class="section-label" id="all-label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1"></rect>
            <rect x="14" y="14" width="7" height="7" rx="1"></rect>
        </svg>
        All Batches
    </div>
    <div id="loading-overlay" class="loading-overlay" style="display:none">
      <div class="spinner"></div>
    </div>
    <div class="grid" id="all-grid"></div>

    <div id="notif-popup" class="notif-popup" style="display:none">
      <div class="notif-popup-inner">
        <div class="notif-popup-close" onclick="dismissNotif()">&times;</div>
        <div class="notif-popup-title" id="notif-popup-title"></div>
        <div class="notif-popup-msg" id="notif-popup-msg"></div>
      </div>
    </div>

    <div id="maint-overlay" class="maint-overlay" style="display:none">
      <div class="maint-box">
        <div class="maint-icon">🛠</div>
        <div class="maint-title">Under Maintenance</div>
        <div class="maint-msg" id="maint-msg">Site is under maintenance. Please check back later.</div>
      </div>
    </div>

    <!-- Watch / Download Modal -->
    <div id="wd-modal" class="wd-modal" style="display:none" onclick="closeWDDialog()">
      <div class="wd-dialog" onclick="event.stopPropagation()">
        <div class="wd-close" onclick="closeWDDialog()">&times;</div>
        <div id="wd-action-view">
          <div class="wd-icon">🎬</div>
          <div class="wd-title" id="wd-title">Video</div>
          <div class="wd-actions">
            <button class="wd-btn wd-watch" id="wd-watch-btn">▶ Watch</button>
            <button class="wd-btn wd-dl" id="wd-dl-btn">⬇ Download</button>
          </div>
        </div>
        <div id="wd-quality-view" style="display:none">
          <div class="wd-icon">⚙️</div>
          <div class="wd-title">Choose quality</div>
          <div class="wd-quality-list" id="wd-quality-list"></div>
          <div class="wd-actions" style="margin-top:14px">
            <button class="wd-btn wd-dl" id="wd-back-btn" style="flex:1">← Back</button>
          </div>
        </div>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>

</html>
