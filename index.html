<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GloryFuel PW</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0f; color: #e0e0e0; font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; }
    .container { max-width: 960px; margin: 0 auto; padding: 20px; }
    header { text-align: center; padding: 40px 0 32px; }
    header h1 { font-size: 2rem; font-weight: 700; }
    header h1 span:first-child { color: #a78bfa; }
    header h1 span:last-child { color: #f59e0b; }
    header p { color: #6b7280; margin-top: 8px; font-size: 0.9rem; }
    .card { background: #12121a; border: 1px solid #1f1f2e; border-radius: 12px; padding: 24px; margin-bottom: 16px; transition: border-color 0.2s, background 0.2s; cursor: pointer; }
    .card:hover { border-color: #7c3aed; background: #18182a; }
    .card h2 { font-size: 1.1rem; color: #a78bfa; font-weight: 600; }
    .card p { color: #6b7280; font-size: 0.85rem; margin-top: 4px; }
    .card .meta { display: flex; gap: 16px; margin-top: 12px; font-size: 0.75rem; color: #4b4b5e; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; border-radius: 8px; border: none; font-size: 0.85rem; cursor: pointer; font-weight: 500; transition: all 0.15s; text-decoration: none; }
    .btn-primary { background: #7c3aed; color: #fff; }
    .btn-primary:hover { background: #6d28d9; }
    .btn-secondary { background: #1f1f2e; color: #a78bfa; border: 1px solid #2d2d45; }
    .btn-secondary:hover { background: #2d2d45; }
    .empty { text-align: center; padding: 60px 0; color: #4b4b5e; }
    .footer { text-align: center; padding: 40px 0; font-size: 0.75rem; color: #3f3f55; }
    .player-link { display: inline-block; margin-top: 12px; }
    input, select { background: #0d0d15; border: 1px solid #1f1f2e; color: #e0e0e0; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; width: 100%; outline: none; }
    input:focus, select:focus { border-color: #7c3aed; }
    label { display: block; font-size: 0.8rem; color: #6b7280; margin-bottom: 4px; }
    .form-group { margin-bottom: 16px; }
    .manual-section { background: #12121a; border: 1px solid #1f1f2e; border-radius: 12px; padding: 24px; margin-top: 24px; }
    .manual-section h3 { color: #a78bfa; font-size: 1rem; font-weight: 500; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><span>GloryFuel</span> <span>PW</span></h1>
      <p>Physics Wallah video player — powered by PiMaxer</p>
    </header>

    <div id="batches"></div>

    <div class="manual-section">
      <h3>Manual URL Builder</h3>
      <div class="form-group">
        <label for="batchId">Batch ID (parentId)</label>
        <input type="text" id="batchId" placeholder="e.g. 67a2fa1daa42be00186a95c1" />
      </div>
      <div class="form-group">
        <label for="childId">Schedule ID (childId)</label>
        <input type="text" id="childId" placeholder="e.g. 67b3c9e30b847c0018687af1" />
      </div>
      <button class="btn btn-primary" onclick="openPlayer()">Open Player</button>
    </div>

    <div class="footer">gloryfuel.fun</div>
  </div>

  <script>
    async function loadBatches() {
      const container = document.getElementById('batches');
      container.innerHTML = '<div class="empty">Loading batches...</div>';
    }

    function openPlayer(batchId, childId) {
      const b = batchId || document.getElementById('batchId').value.trim();
      const c = childId || document.getElementById('childId').value.trim();
      if (!b || !c) return alert('Enter both Batch ID and Schedule ID');
      window.open(`/player.html?batchId=${encodeURIComponent(b)}&childId=${encodeURIComponent(c)}`, '_blank');
    }

    loadBatches();
  </script>
</body>
</html>
